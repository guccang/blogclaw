name: Secret check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test secret guard
        run: python3 -m unittest discover -s scripts -p 'test_check_secrets.py' -v
      - name: Check tracked snapshot
        run: python3 scripts/check_secrets.py
